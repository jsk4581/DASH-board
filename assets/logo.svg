<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- DASH logo: the whole icon is a calendar leaf with the kio bird on it.
       A band across the top with two ring tabs hanging from it; the bird's
       wing feathers are schedule bars. Colours follow the app tokens
       (accent-ink, accent). The leaf is clipped to a rounded square here;
       on Android the launcher mask does the clipping instead, so the band
       must stay full-bleed. scripts/logo.mjs parses this element structure
       (page rect, band rect, tab circles, bird group with data-cx/cy), so
       keep it when editing. -->
  <style>
    .page { fill: #ffffff; stroke: #cfd8e6; stroke-width: 12; }
    .band { fill: #0e4786; }
    .wing { stroke: #5788c7; }
    .body { fill: #0e4786; }
  </style>
  <clipPath id="leaf"><rect width="1024" height="1024" rx="225"/></clipPath>
  <g clip-path="url(#leaf)">
    <rect class="page" width="1024" height="1024" rx="225"/>
    <rect class="band" width="1024" height="184"/>
    <circle class="band" cx="312" cy="184" r="52"/>
    <circle class="band" cx="712" cy="184" r="52"/>
    <g class="bird" data-cx="512" data-cy="604" transform="translate(91.52,64.35) scale(0.75423)">
      <g class="wing" fill="none" stroke-width="62" stroke-linecap="round">
        <line x1="463" y1="799" x2="773" y2="303"/>
        <line x1="541" y1="848" x2="798" y2="437"/>
        <line x1="619" y1="897" x2="823" y2="570"/>
      </g>
      <path class="body" d="M545.0 1159.7C545.0 1159.4 545.9 1157.0 547.1 1154.3C557.2 1130.7 562.6 1076.2 557.7 1046.0C548.6 989.7 521.7 942.7 469.6 892.0C405.7 829.9 395.7 817.7 377.0 779.5C362.5 749.8 355.5 727.1 347.5 683.4C336.3 622.2 326.2 597.0 301.7 568.4C281.9 545.3 266.1 533.9 239.9 523.7C229.8 519.7 212.2 512.6 200.8 508.0L180.0 499.5L185.3 498.7C191.2 497.9 204.4 498.4 236.8 500.6C264.1 502.5 263.0 502.8 293.6 489.7C324.6 476.4 324.1 476.5 345.0 476.5C361.5 476.6 363.0 476.8 371.0 479.4C409.3 492.1 429.9 519.6 443.5 576.0C455.4 625.4 462.8 649.1 473.0 670.5C499.7 726.6 537.4 754.0 636.5 789.1C700.8 812.0 725.8 823.4 757.0 844.3C837.1 897.8 896.5 985.7 923.9 1091.0C929.8 1113.7 935.8 1145.3 934.5 1146.8C934.3 1147.0 931.0 1142.5 927.0 1136.8C881.1 1071.7 816.0 1022.9 730.5 989.7C710.1 981.8 679.8 970.6 652.0 960.7C613.7 947.0 603.3 942.9 582.1 932.8C576.4 930.1 571.6 928.1 571.3 928.3C571.1 928.6 573.1 932.8 575.8 937.6C592.6 968.0 600.0 998.3 598.7 1032.4C597.3 1069.3 588.2 1099.1 568.8 1130.0C560.8 1142.6 545.0 1162.4 545.0 1159.7Z"/>
